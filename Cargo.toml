[package]
name = "wodbuster-jueces"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
aes-gcm = "0.10"
chromiumoxide = "0.9.1"
dotenvy = "0.15"
futures-util = "0.3"
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
topcoat = { version = "0.10", default-features = false, features = ["router", "view", "serve", "cookie"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
base64 = "0.22"
cookie = { version = "0.18", features = ["signed"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls"] }

[profile.dev]
debug = 0
